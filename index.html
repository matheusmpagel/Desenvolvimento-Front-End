<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Acadêmicas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
    </header>

    <main>

        <section aria-labelledby="titulo-busca-filtros">
        <h2 id="titulo-busca-filtros">Busca e Filtros</h2>
            <form>
                <div class="filtros">
                    <label for="busca-titulo">Buscar tarefa por título: </label>
                    <input type="text" id="busca-titulo" name="busca-titulo">
                </div>

                <fieldset class="filtros">
                    <legend>Filtrar por status</legend>
                    <div>
                        <input type="radio" name="status" id="status-todos" value="todos" checked>
                        <label for="status-todos">Todos</label>
                    </div>
                    <div>
                        <input type="radio" name="status" id="status-fazer" value="fazer">
                        <label for="status-fazer">A fazer</label>
                    </div>
                    <div>
                        <input type="radio" name="status" id="status-andamento" value="andamento">
                        <label for="status-andamento">Em andamento</label>
                    </div>
                    <div>
                        <input type="radio" name="status" id="status-revisao" value="revisao">
                        <label for="status-revisao">Em revisão</label>
                    </div>
                    <div>
                        <input type="radio" name="status" id="status-concluida" value="concluida">
                        <label for="status-concluida">Concluída</label>
                    </div>
                </fieldset>

                <fieldset class="filtros">
                    <legend>Filtrar por prioridade</legend>
                    <div>
                        <input type="radio" name="prioridade" id="prioridade-todas" value="todas" checked>
                        <label for="prioridade-todas">Todas</label>
                    </div>
                    <div>
                        <input type="radio" name="prioridade" id="prioridade-alta" value="alta">
                        <label for="prioridade-alta">Alta</label>
                    </div>
                    <div>
                        <input type="radio" name="prioridade" id="prioridade-media" value="media">
                        <label for="prioridade-media">Média</label>
                    </div>
                    <div>
                        <input type="radio" name="prioridade" id="prioridade-baixa" value="baixa">
                        <label for="prioridade-baixa">Baixa</label>
                    </div>
                </fieldset>

                <button type="button" id="limpar-filtros">Limpar filtros</button>
                
            </form>
        </section>

        <p id="status-tarefas" data-estado role="status" aria-live="polite"></p>

        <section aria-labelledby="titulo-quadro-tarefas" class="quadro" data-quadro>
            <h2 id="titulo-quadro-tarefas">Quadro de Tarefas</h2>

            <section aria-labelledby="status-titulo-fazer" class="coluna" data-status="fazer">
                <h3 id="status-titulo-fazer">A fazer</h3>
                    <ul>

                    </ul>
            </section>

            <section aria-labelledby="status-titulo-andamento" class="coluna" data-status="andamento">
                <h3 id="status-titulo-andamento">Em andamento</h3>
                    <ul>

                    </ul>
            </section>

            <section aria-labelledby="status-titulo-revisao" class="coluna" data-status="revisao">
                <h3 id="status-titulo-revisao">Em revisão</h3>
                    <ul>

                    </ul>
            </section>

            <section aria-labelledby="status-titulo-concluida" class="coluna" data-status="concluida">
                <h3 id="status-titulo-concluida">Concluída</h3>
                    <ul>

                    </ul>
            </section>

        </section>
    </main>

    <footer>
        <p>Matheus M. Pagel — Desenvolvimento Frontend — 2026/2</p>
    </footer>

    <script type="module" src="js/app.js"></script>

</body>
</html>
